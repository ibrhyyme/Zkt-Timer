	<!-- This file is sent as it is, so everything lives here: no server rendering, no

	<script>
		// Same snapshot the app's <head> script reads (server/html_template.ts).
		try {
			var t = JSON.parse(localStorage.getItem('zkt_theme'));
			if (t) {
				var s = document.documentElement.style;
				if (t.bg) s.setProperty('--background-color', t.bg);
				if (t.txt) s.setProperty('--text-color', t.txt);
				if (t.pri) {
					s.setProperty('--primary-color', t.pri);
					// A light accent (some Pro themes) needs dark text on its fill.
					var c = t.pri.split(',').map(Number);
					if (0.299 * c[0] + 0.587 * c[1] + 0.114 * c[2] > 170) s.setProperty('--on-primary', '12, 13, 23');
				}
			}
		} catch (e) {}
	</script>

		.lead {

			color: rgba(var(--text-color), 0.72);
		}

		.actions {
			display: flex;
			flex-wrap: wrap;
			justify-content: center;
			gap: 8px;
			margin-top: 24px;
		}

		.btn {
			display: inline-flex;
			align-items: center;
			justify-content: center;
			gap: 8px;
			min-height: 40px;
			padding: 0 16px;
			border: 0;
			border-radius: 4px;
			background: rgba(var(--text-color), 0.08);
			color: rgb(var(--text-color));
			font: inherit;

			font-weight: 600;
			text-decoration: none;
			cursor: pointer;
		}

		.btn:hover {

		}

		.btn--primary,

		.btn[hidden] {

		nav {

			gap: 4px;

			padding-top: 16px;

		nav a {

			align-items: center;
			gap: 8px;
			min-height: 32px;
			padding: 0 8px;
			border-radius: 4px;
			color: rgba(var(--text-color), 0.72);
			font-size: 0.875rem;
			text-decoration: none;
		}

		nav a:hover {
			color: rgb(var(--text-color));
		}

		a:focus-visible,
		button:focus-visible {
			outline: 2px solid rgb(var(--primary-color));
			outline-offset: 2px;
		}

		@media (max-width: 767.98px) {
			.cube {

			}

			}

				flex: 1 1 100%;
			}

			// Same order as the app: the saved language, then the browser's list, then English.
			function pick() {
				var saved = document.cookie.match(/(?:^|; )zkt_language=([^;]*)/);
				var tags = (saved ? [saved[1]] : []).concat(navigator.languages || [navigator.language || '']);
				for (var i = 0; i < tags.length; i++) {
					var code = String(tags[i]).toLowerCase().split('-')[0];

				}
				return 'en';
			}

			var lang = pick();
			var text = TEXT[lang];
			document.documentElement.lang = lang;
			document.title = text.title + ' | ZKT Timer';
			var nodes = document.querySelectorAll('[data-t]');
			for (var i = 0; i < nodes.length; i++) nodes[i].textContent = text[nodes[i].getAttribute('data-t')];

			if (history.length > 1) {

					history.back();
				});
			}
