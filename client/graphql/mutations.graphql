mutation linkRevenueCatUser {
	linkRevenueCatUser
}

mutation CreateSupportTicket($input: SupportTicketInput!) {
	createSupportTicket(input: $input) {
		id
	}
}

mutation ResolveSupportTicket($id: String!) {
	resolveSupportTicket(id: $id) {
		id
		resolved_at
	}
}

mutation AddSupportTicketMessage($ticketId: String!, $body: String!, $attachments: [Upload!]) {
	addSupportTicketMessage(ticketId: $ticketId, body: $body, attachments: $attachments) {
		id
		body
		is_admin
		created_at
		attachments {
			id
			storage_path
			mime_type
			kind
			size_bytes
			original_name
		}
	}
}

mutation UpdateLocale($locale: String!) {
	setSetting(input: { locale: $locale }) {
		id
	}
}

mutation updateSiteConfig($input: UpdateSiteConfigInput!) {
	updateSiteConfig(input: $input) {
		id
		maintenance_mode
		trainer_enabled
		community_enabled
		leaderboards_enabled
		rooms_enabled
		battle_enabled
		messaging_enabled
		presence_enabled
		pro_enabled
		wca_backfill_enabled
		smart_telemetry_enabled
		featureOverrides {
			feature
			mode
			users {
				id
				username
			}
		}
		updated_at
	}
}

mutation mergeSessions($oldSessionId: String, $newSessionId: String) {
	mergeSessions(oldSessionId: $oldSessionId, newSessionId: $newSessionId) {
		...SessionFragment
	}
}

mutation createSession($input: SessionInput) {
	createSession(input: $input) {
		...SessionFragment
	}
}

mutation updateSession($id: String, $input: SessionInput) {
	updateSession(id: $id, input: $input) {
		...SessionFragment
	}
}

mutation deleteSession($id: String) {
	deleteSession(id: $id) {
		...SessionFragment
	}
}

mutation reorderSessions($ids: [String]!) {
	reorderSessions(ids: $ids)
}

mutation bulkDeleteSessions($ids: [String]!) {
	bulkDeleteSessions(ids: $ids)
}

mutation createAnnouncement($input: CreateAnnouncementInput!) {
	createAnnouncement(input: $input) {
		id
		title
		category
		isDraft
		targetUrl
	}
}

mutation updateAnnouncement($id: String!, $input: UpdateAnnouncementInput!) {
	updateAnnouncement(id: $id, input: $input) {
		id
		title
		category
		isDraft
		targetUrl
	}
}

mutation markAnnouncementAsViewed($announcementId: String!) {
	markAnnouncementAsViewed(announcementId: $announcementId)
}

mutation deleteAnnouncement($id: String!) {
