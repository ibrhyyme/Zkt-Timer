}

mutation translateAnnouncementContent($title: String!, $content: String!) {
	translateAnnouncementContent(title: $title, content: $content) {
		title {
			en
			es
			ru
			zh
		}
		content {
			en
			es
			ru
			zh
		}
	}
}

mutation createTrainerAlternative($input: TrainerAlternativeCreateInput!) {
