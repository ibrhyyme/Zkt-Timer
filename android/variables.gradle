ext {
    // 24 required by Capacitor 8 (its minimum). API 23 = Android 6.0, negligible
    // user base; existing API-23 installs simply keep the old version on Play, they
    // are not broken. The SDK + androidx values below mirror Capacitor 8's own
    // defaults (node_modules/@capacitor/android/capacitor/build.gradle) so the app
    // module and the Capacitor modules stay on the same versions.
    minSdkVersion = 24
    compileSdkVersion = 36
    targetSdkVersion = 36
    androidxActivityVersion = '1.11.0'
    androidxAppCompatVersion = '1.7.1'
    androidxCoordinatorLayoutVersion = '1.3.0'
    androidxCoreVersion = '1.17.0'
    androidxFragmentVersion = '1.8.9'
    coreSplashScreenVersion = '1.0.1'
    androidxWebkitVersion = '1.14.0'
    junitVersion = '4.13.2'
    androidxJunitVersion = '1.3.0'
    androidxEspressoCoreVersion = '3.7.0'
    cordovaAndroidVersion = '14.0.1'
}