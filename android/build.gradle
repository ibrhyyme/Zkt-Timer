// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.2'
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.2.20'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }

    // Capacitor 8 + JDK 21: unify every module's Kotlin target to 21 so a plugin
    // that hardcodes a different target can't trigger AGP's "Inconsistent JVM
    // target" error. (kotlinOptions is deprecated in Kotlin 2.x but still valid.)
    afterEvaluate {
        tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
            kotlinOptions {
                jvmTarget = "21"
            }
        }
    }
}

// Some plugins (e.g. RevenueCat) hardcode Java 1.8/17 in their own compileOptions,
// which clashes with Capacitor 8's Java 21 modules. Force every Android subproject
// to Java 21 for a single consistent toolchain.
subprojects {
    afterEvaluate { project ->
        if (project.hasProperty('android')) {
            project.android.compileOptions {
                sourceCompatibility JavaVersion.VERSION_21
                targetCompatibility JavaVersion.VERSION_21
            }
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
